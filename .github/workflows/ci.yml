name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://digimmo:digimmo@localhost:5432/digimmo_test
      MONGO_URL: mongodb://localhost:27017/digimmo_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: digimmo
          POSTGRES_PASSWORD: digimmo
          POSTGRES_DB: digimmo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digimmo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @digimmo/domain
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e -w @digimmo/back
      - run: npm run build
