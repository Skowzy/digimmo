services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: digimmo
      POSTGRES_PASSWORD: digimmo
      POSTGRES_DB: digimmo
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U digimmo -d digimmo']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  mongo-data:
